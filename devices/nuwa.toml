[device]
codename = "nuwa"
brand = "Xiaomi"
model = "Xiaomi 13 Pro"
ab = true
soc = { hans = "第二代骁龙®8移动平台", hant = "Snapdragon® 8 Gen 2 行動平台", en = "Snapdragon® 8 Gen 2 Mobile Platform" }
os_version_prop = "ro.mi.os.version.incremental"

[display]
# The panel's own mode in the device tree: the m2 panels are 1440 by 3200.
# persist.sys.miui_resolution in the odm partition's build.prop gives the
# lower mode the system starts in, 1080 by 2400 at 420, as the 13 Ultra's
# does; the density is that one's, at the panel's own width, as the 13
# Ultra's is.
width = 1440
height = 3200
density = 560

[modules]
sources = ["vendor_boot", "vendor_dlkm", "vendor"]
# The touchscreen: ST FTS over SPI, the one touch driver the phone's own
# modules.load lists, as on the 13 Ultra.
load = ["fts_touch_spi"]

# 固件镜像所在的 modem 分区：安全世界的程序（keymint 的 TA）由 qseecomd 从
# /vendor/firmware_mnt/image 加载，原厂 recovery 不挂它。
[firmware]
partition = "modem"

# persist 由安全世界通过 qseecomd 注册的监听写入，其中就有不能回滚的密钥要用的
# 文件（本机 /mnt/vendor/persist/keytemp/keyinfo.txt、tee_priv_key）。
[partitions]
mounted = ["persist"]

# What /odm/etc/init/vendor.xiaomi.hw.touchfeature@1.0-service.rc hands to
# the system user on boot, which has the same chown and chmod lines as the
# 13 Ultra's: the touch layer's own nodes, its switches and the driver's
# files in /proc, which the touch programs below open as that user. These
# are the 13 Ultra's, which were each seen made as the touch modules load
# there, less those whose names this phone's xiaomi_touch.ko and
# fts_touch_spi.ko do not carry.
[[owners]]
user = "system"
group = "system"
mode = 0o664
paths = [
    "/dev/xiaomi-touch",
    "/dev/xiaomi-touch-knock",
    "/sys/class/touch/touch_dev/gesture_single_tap_state",
    "/sys/class/touch/touch_dev/fod_press_status",
    "/proc/tp_selftest",
    "/sys/class/touch/touch_dev/update_rawdata",
    "/sys/class/touch/touch_dev/enable_touch_raw",
    "/sys/class/touch/touch_dev/enable_touch_delta",
    "/sys/class/touch/touch_dev/touch_thp_dump",
    "/sys/class/touch/touch_dev/touch_thp_cmd",
    "/sys/class/touch/touch_dev/suspend_state",
    "/sys/class/touch/touch_dev/prox_sensor",
    "/sys/class/touch/touch_dev/touch_thp_rx_num",
    "/sys/class/touch/touch_dev/touch_thp_tx_num",
    "/sys/class/touch/touch_dev/touch_thp_x_resolution",
    "/sys/class/touch/touch_dev/touch_thp_y_resolution",
    "/sys/class/touch/touch_dev/touch_thp_smooth",
    "/sys/class/touch/touch_dev/touch_thp_noisefilter",
    "/sys/class/touch/touch_dev/touch_thp_downthd",
    "/sys/class/touch/touch_dev/touch_thp_upthd",
    "/sys/class/touch/touch_dev/touch_thp_movethd",
    "/sys/class/touch/touch_dev/touch_thp_islandthd",
    "/sys/class/touch/touch_dev/touch_thp_cmd_data",
    "/sys/class/touch/touch_dev/palm_sensor_data",
    "/sys/class/touch/touch_dev/palm_sensor",
    "/proc/tp_hal_version",
    "/proc/tp_fw_version",
    "/proc/tp_lockdown_info",
    "/sys/class/touch/touch_dev/touch_active_status",
    "/sys/class/touch/touch_dev/touch_finger_status",
    "/sys/class/touch/touch_dev/touch_irq_no",
    "/sys/class/touch/touch_dev/touch_sensor",
    "/sys/class/touch/touch_dev/touch_sensor_ctrl",
    "/sys/class/touch/touch_dev/touch_thp_mem_notify",
    "/sys/class/touch/touch_dev/touch_thp_testmode",
    "/sys/class/touch/touch_dev/touch_thp_testresult",
    "/sys/class/touch/touch_dev/touch_thp_preset_point",
    "/sys/class/touch/touch_dev/touch_doze_analysis",
    "/sys/class/touch/touch_dev/touch_thp_cmd_ready",
    "/sys/class/touch/touch_dev/touch_ic_buffer",
    "/sys/class/touch/touch_dev/abnormal_event",
]

# Each of the phone's own programs below runs as the user, in the groups
# and with the capabilities its init script on the phone gives it.

# What the phone's own init runs once the system has finished starting, as
# kernel-post-boot in /vendor/etc/init/hw/init.qti.kernel.rc. The kernel
# starts the CPU clusters on the performance governor, which holds them at
# their highest clock; the script hands them to WALT, lets idle CPUs power
# down and sets how the memory bus scales. Without it the CPUs stay at
# their highest clock and voltage even while idle, and the phone slowly
# heats up. It runs before the touch programs, which need none of it.
[[service]]
path = "/vendor/bin/sh"
args = ["/vendor/bin/init.kernel.post_boot.sh"]
libraries = ["/system/lib64", "/vendor/lib64"]
oneshot = true
user = "root"
groups = ["root", "system", "wakelock", "graphics"]

# The panel hands raw frames to the host, as on the 13 Ultra. touch_report
# turns them into touches on the fts input device; touchsensor tells water,
# gloves and screen protectors apart with the models in /odm/firmware.
[[service]]
path = "/odm/bin/touch_report"
user = "system"
groups = ["system", "uhid", "input"]
capabilities = ["SYS_NICE"]

[[service]]
path = "/odm/bin/touchsensor"
libraries = ["/odm/lib64", "/system/lib64"]
user = "system"
groups = ["system", "uhid", "input"]

# 解密 data 要的厂商服务。本机（nuwa / OS4.0.5.0.XPCCNXM）核对过：
# /vendor/bin/qseecomd、/vendor/bin/hw/android.hardware.security.keymint-service-qti、
# /vendor/bin/hw/android.hardware.gatekeeper@1.0-service-qti、
# /system_ext/bin/hwservicemanager、/vendor/bin/hw/android.hardware.boot@1.2-service
# 全部存在；gatekeeper 是旧的 HIDL 1.0 那一类，所以要先起 hwservicemanager。

# 安全世界回连 Android 走这个守护进程注册的监听，没有它密钥服务一把钥匙都用不了。
[[service]]
path = "/vendor/bin/qseecomd"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_property = "vendor.sys.listeners.registered"
user = "root"
groups = ["root", "drmrpc"]

# 密钥服务：硬件包起来的密钥只有它能用。同一个程序还提供远程证明、安全时钟与
# 共享密钥，手机把它们描述成另外三条服务。
[[service]]
path = "/vendor/bin/hw/android.hardware.security.keymint-service-qti"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_service = "android.hardware.security.keymint.IKeyMintDevice/default"
registers = [
    "android.hardware.security.keymint.IRemotelyProvisionedComponent/default",
    "android.hardware.security.secureclock.ISecureClock/default",
    "android.hardware.security.sharedsecret.ISharedSecret/default",
]
user = "system"
groups = ["system", "drmrpc"]

# 旧式硬件服务的目录。recovery 自己不带，用装机系统里的那个程序跑在装机系统的库上。
[[service]]
path = "/mnt/system_ext/bin/hwservicemanager"
libraries = ["/mnt/system/system/lib64/bootstrap", "/mnt/system/system/lib64", "/mnt/system_ext/lib64"]
ready_property = "hwservicemanager.ready"
user = "system"
groups = ["system", "readproc"]

# 凭据服务：由安全世界校验锁屏密码，也是唯一能给出密钥服务要的那张凭据的东西。
[[service]]
path = "/vendor/bin/hw/android.hardware.gatekeeper@1.0-service-qti"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_hardware_service = "android.hardware.gatekeeper@1.0::IGatekeeper/default"
user = "system"
groups = ["system"]

# 启动控制，报出 bootloader 下次启动哪个槽位并切换它，写 bootloader 读的地方。
[[service]]
path = "/vendor/bin/hw/android.hardware.boot@1.2-service"
libraries = ["/system/lib64", "/vendor/lib64"]
ready_hardware_service = "android.hardware.boot@1.2::IBootControl/default"
user = "root"
groups = ["root"]

# WLAN: the same converged node in the device tree as the 13 Ultra's, which
# names no one chip. The phone's own modules.load lists qca_cld3_kiwi,
# qca_cld3_kiwi_v2 and qca_cld3_qca6490 and blocks none of them; the 13
# Ultra's WCN7850 is driven by qca_cld3_kiwi_v2, and so is this phone's
# taken to be. Its recovery covers the vendor partition's firmware folder
# with the modem's, as the 13 Ultra's does, so the settings and the MAC
# address are given to the loader again: the settings from the vendor
# partition, the address from where the vendor's link points in persist.
[wlan]
modules = ["qca_cld3_kiwi_v2"]
writes = [{ path = "/sys/kernel/cnss/fs_ready", value = "1" }]
firmware = [
    { name = "wlan/qca_cld/kiwi_v2/WCNSS_qcom_cfg.ini", path = "/vendor/etc/wifi/kiwi_v2/WCNSS_qcom_cfg.ini" },
    # persist 已经由 [partitions] 挂在 /mnt/vendor/persist，直接从这里读：让
    # skyward 自己去挂会撞上「已经挂过」，mount 返回 EBUSY，WLAN 整条起不来。
    { name = "wlan/qca_cld/kiwi_v2/wlan_mac.bin", path = "/mnt/vendor/persist/kiwi_v2/wlan_mac.bin" },
]
interface = "wlan0"
supplicant = "/vendor/bin/hw/wpa_supplicant"
# wpa_supplicant 跑在 recovery 自己的库上，厂商分区的那份排在后面：厂商分区
# 带着最底层那几个库的自己一份，程序加载了它就不被 recovery 的服务目录认了。
libraries = ["/system/lib64", "/vendor/lib64"]
service = "android.hardware.wifi.supplicant.ISupplicant/default"
probe = "http://connect.rom.miui.com/generate_204"

# The update server the stock updater of the Chinese system asks.
[update]
server = "https://update.miui.com/updates/miotaV3.php"
# 恢复里「版本更新」问的是本仓库的 docs/update.json，不是上游：上游的包是 pudding
# 的，装上去会把这份的改动全冲掉。走 gh-proxy 镜像，直连 raw.githubusercontent 在
# 国内经常拉不动。
skyward = "https://gh-proxy.com/https://raw.githubusercontent.com/qq3411cc/skyward-nuwa/main/docs/update.json"

# The stock build the recovery is made on: the Chinese system's
# OS3.0.312.0, whose full update package on the phone maker's own download
# server holds the recovery partition the recovery is built on top of.
[stock]
version = "OS3.0.312.0.WMBCNXM"
package = "https://bkt-sgp-miui-ota-update-alisgp.oss-ap-southeast-1.aliyuncs.com/OS3.0.312.0.WMBCNXM/nuwa-ota_full-OS3.0.312.0.WMBCNXM-user-16.0-a884231e4f.zip"
recovery = "04431f150316d32fc5fd38ac8caf7e48ee271fa47cd23a28ad7e067e5fcde273"

# qcom-hv-haptics, as on the 13 Ultra, whose driver plays the click it
# keeps as waveform 0 and says the motor's resonant frequency in
# lra_frequency_hz; the strengths are the 13 Ultra's.
[haptics]
click = 0
resonance = "/sys/class/qcom-haptics/lra_frequency_hz"
strength = { lightest = 0.5, strongest = 1.0 }
