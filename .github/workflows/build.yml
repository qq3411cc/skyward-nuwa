name: build

# 推 main / tag / 手动触发，整份镜像在 GitHub 的机器上编出来：
#   1. 取 upstream.json 里 base 指的上游源码（kirklin/skyward 的 tag，核对源码包哈希）
#   2. 打 upstream.json 里 patches 指的补丁（mariusarva/skyward-pudding，按提交+哈希钉死）
#   3. 再打本仓库的 patches/skyward-nuwa-extra.patch
#   4. 交叉编译 skyward 与 system-init
#   5. 用 skyward-pack 取原厂 recovery 打包成整份镜像（带自己的 AVB 头尾）
#   6. 出 img 与 zip，挂到 Release，并把 docs/update.json 写成这一版
#      （恢复里的「版本更新」读的就是这个文件）

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      release:
        description: '写进二进制的发布号，例如 0.2.49'
        required: true
        default: '0.2.49'

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: 工具
        run: sudo apt-get update && sudo apt-get install -y lz4 cpio patch zip

      - name: Rust 与 aarch64 目标
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Android NDK
        run: |
          set -e
          curl -fL --retry 3 -o "$RUNNER_TEMP/ndk.zip" \
            https://dl.google.com/android/repository/android-ndk-r29-linux.zip
          unzip -q "$RUNNER_TEMP/ndk.zip" -d "$RUNNER_TEMP"
          echo "ANDROID_NDK_HOME=$RUNNER_TEMP/android-ndk-r29" >> "$GITHUB_ENV"

      - name: 取上游源码并打补丁
        run: |
          set -euxo pipefail
          read_pin() { python3 -c "import json,sys;d=json.load(open('upstream.json'));print(eval(sys.argv[1]))" "$1"; }
          BASE_REPO=$(read_pin "d['base']['repository']")
          BASE_TAG=$(read_pin "d['base']['tag']")
          BASE_SHA=$(read_pin "d['base'].get('tarball_sha256','')")
          P_REPO=$(read_pin "d['patches']['repository']")
          P_COMMIT=$(read_pin "d['patches']['commit']")
          P_PATH=$(read_pin "d['patches']['path']")
          P_SHA=$(read_pin "d['patches']['sha256']")
          echo "上游：$BASE_REPO $BASE_TAG   补丁：$P_REPO $P_COMMIT $P_PATH"

          curl -fL --retry 3 -o upstream.tar.gz "https://codeload.github.com/$BASE_REPO/tar.gz/refs/tags/$BASE_TAG"
          if [ -n "$BASE_SHA" ]; then echo "$BASE_SHA  upstream.tar.gz" | sha256sum -c -; fi
          mkdir -p src
          tar xzf upstream.tar.gz -C src --strip-components=1

          curl -fL --retry 3 -o pudding.patch \
            "https://raw.githubusercontent.com/$P_REPO/$P_COMMIT/$P_PATH"
          echo "$P_SHA  pudding.patch" | sha256sum -c -

          cd src
          for P in ../pudding.patch ../patches/skyward-nuwa-extra.patch; do
            echo "== 打 $(basename "$P")"
            patch -p1 --batch --no-backup-if-mismatch < "$P"
            if find . -name '*.rej' | head -1 | grep -q .; then
              echo "!! $(basename "$P") 有冲突："
              find . -name '*.rej' -exec sh -c 'echo "--- $1"; cat "$1"' _ {} \;
              exit 1
            fi
          done
          # 本仓库的设备配置覆盖上游那份：解密 data 要的厂商服务在这里
          cp ../devices/nuwa.toml devices/nuwa.toml
          echo "补丁打上了，设备配置已换成本仓库的"

      - name: 交叉编译
        run: |
          set -e
          NDK="$ANDROID_NDK_HOME"
          SYSROOT="$NDK/toolchains/llvm/prebuilt/linux-x86_64/sysroot"
          BUILTINS=$(dirname "$(find "$NDK/toolchains/llvm/prebuilt/linux-x86_64/lib/clang" \
            -name 'libclang_rt.builtins-aarch64-android.a' | head -1)")
          CLANG="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/clang"
          printf '#!/bin/sh\nexec "%s" --target=aarch64-linux-android30 --sysroot="%s" -rtlib=compiler-rt -L"%s" "$@"\n' \
            "$CLANG" "$SYSROOT" "$BUILTINS" > /tmp/cc-aarch64.sh
          chmod +x /tmp/cc-aarch64.sh
          # 发布号：手动触发与 tag 用它，推 main 时用默认值（不能用 main）
          RELEASE="${{ github.event.inputs.release || '' }}"
          if [ -z "$RELEASE" ]; then
            case "$GITHUB_REF" in
              refs/tags/*) RELEASE="${GITHUB_REF#refs/tags/}" ;;
              *) RELEASE="0.2.49" ;;
            esac
          fi
          RELEASE="${RELEASE#v}"
          echo "发布号：$RELEASE"
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
          export CC_aarch64_linux_android=/tmp/cc-aarch64.sh
          export AR_aarch64_linux_android=ar
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER=/tmp/cc-aarch64.sh
          export SKYWARD_RELEASE="$RELEASE"
          cd src
          cargo build --release -p skyward --target aarch64-linux-android
          RUSTFLAGS="-C target-feature=+crt-static" \
            cargo build --release -p skyward-system-init --target aarch64-linux-android \
            --target-dir target/system-init
          cargo build --release -p skyward-pack

      - name: 取原厂 recovery 并打包
        run: |
          set -e
          cd src
          mkdir -p ../stock
          ./target/release/skyward-pack stock --config devices/nuwa.toml --out ../stock/recovery.img
          NAME="skyward-nuwa-$(date +%Y%m%d)-$RELEASE-OS4.0.5.0.XPCCNXM.img"
          ./target/release/skyward-pack recovery \
            --stock ../stock/recovery.img \
            --binary target/aarch64-linux-android/release/skyward \
            --system-init target/system-init/aarch64-linux-android/release/system-init \
            --config devices/nuwa.toml \
            --font resources/fonts/MiSansVF.ttf \
            --mono resources/fonts/KirkMono-Regular.ttf \
            --mono-license resources/fonts/KirkMono-OFL.txt \
            --out "../$NAME"
          cd ..
          # 更新器要的是「只含一个 .img 的 zip」
          ZIP="${NAME%.img}.zip"
          zip -9 -j "$ZIP" "$NAME" > /dev/null
          sha256sum "$NAME" "$ZIP" | tee SHA256SUMS
          echo "NAME=$NAME" >> "$GITHUB_ENV"
          echo "ZIP=$ZIP" >> "$GITHUB_ENV"

      - uses: actions/upload-artifact@v4
        with:
          name: image
          path: |
            skyward-nuwa-*.img
            skyward-nuwa-*.zip
            SHA256SUMS

      # 推送 tag 时挂到该 tag 的 Release；推 main 或手动触发时挂到固定 tag
      - name: 发布到 Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          if [ "${GITHUB_REF#refs/tags/}" != "$GITHUB_REF" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
          else
            TAG="v0.2.49-nuwa"
          fi
          echo "发布到 $TAG"
          gh release view "$TAG" >/dev/null 2>&1 || \
            gh release create "$TAG" --target "$GITHUB_SHA" --title "Skyward for Xiaomi 13 Pro (nuwa) $TAG" \
              --notes "由 GitHub Actions 在 \`$GITHUB_SHA\` 上构建（上游 kirklin/skyward + mariusarva/skyward-pudding 补丁 + 本仓库补丁）。解密 data 的厂商服务见 devices/nuwa.toml 与 docs/开发记录.md。"
          # 只留一份：先删掉旧的 .img / .zip
          gh release view "$TAG" --json assets -q '.assets[].name' 2>/dev/null | grep -E '\.(img|zip)$' | \
            while read -r old; do gh release delete-asset "$TAG" "$old" -y || true; done
          gh release upload "$TAG" skyward-nuwa-*.img skyward-nuwa-*.zip SHA256SUMS --clobber
          echo "TAG=$TAG" >> "$GITHUB_ENV"

      # 恢复里的「版本更新」读 docs/update.json：写成这一版，推回去
      - name: 写 docs/update.json
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -e
          TAG="${{ env.TAG }}"
          NAME="${{ env.NAME }}"
          ZIP="${{ env.ZIP }}"
          SIZE=$(stat -c %s "$ZIP")
          DIGEST=$(sha256sum "$ZIP" | cut -d' ' -f1)
          RAW="https://github.com/qq3411cc/skyward-nuwa/releases/download/$TAG/$ZIP"
          python3 - "$TAG" "$ZIP" "$SIZE" "$DIGEST" "$RAW" <<'PY'
          import json, sys
          tag, name, size, digest, raw = sys.argv[1:6]
          doc = {
              "tag_name": tag,
              "assets": [{
                  "name": name,
                  "size": int(size),
                  "digest": "sha256:" + digest,
                  "url": "https://gh-proxy.com/" + raw,
                  "browser_download_url": raw,
              }],
          }
          open("docs/update.json", "w").write(json.dumps(doc, ensure_ascii=False, indent=2) + "\n")
          PY
          cat docs/update.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/update.json
          git commit -m "update.json: $TAG（$ZIP）[skip ci]" || echo "没有变化"
          git push
