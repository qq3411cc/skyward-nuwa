name: sync-upstream

# 上游是 mariusarva/skyward-pudding 的补丁（本仓库的代码 = kirklin/skyward 的某个
# tag + 那份补丁 + 本仓库补丁）。这个流程盯的是「补丁目录里有没有更新的版本」：
#   1. 读 upstream.json 里钉的补丁路径
#   2. 查上游 patches/ 目录，取版本号最大的那个
#   3. 一样就结束
#   4. 不一样就下新补丁，先 --dry-run 试打「新补丁 + 本仓库补丁」
#   5. 都过得去：改 upstream.json 的 commit/path/sha256，提交推 main，再叫一次构建
#   6. 有冲突：开 issue 把失败 hunk 列出来，运行标红
#
# 上游补丁是按上游 v0.2.0 出的，冲突是常态：这里的价值是「上游一动就有人告诉你，
# 并把冲突位置贴出来」，能自动过的就直接出包。

on:
  schedule:
    - cron: '0 20 * * *'      # 每天 04:00（Asia/Shanghai）
  workflow_dispatch:
    inputs:
      path:
        description: '指定要同步到的补丁路径（留空则取上游最新）'
        required: false
        default: ''

permissions:
  contents: write
  issues: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 工具
        run: sudo apt-get update && sudo apt-get install -y patch jq curl

      - name: 查上游最新的补丁
        id: up
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          WANTED: ${{ github.event.inputs.path }}
        run: |
          set -euo pipefail
          PINNED=$(jq -r '.patches.path' upstream.json)
          REPO=$(jq -r '.patches.repository' upstream.json)
          if [ -n "$WANTED" ]; then
            NEW="$WANTED"
          else
            NEW=$(gh api "repos/$REPO/contents/patches" --paginate -q '.[].name' \
              | grep -E '^skyward-pudding-v[0-9]+\.[0-9]+\.[0-9]+\.patch$' | sort -V | tail -1)
          fi
          echo "钉的：$PINNED   上游最新：$NEW"
          COMMIT=$(gh api "repos/$REPO/commits?per_page=1" -q '.[0].sha')
          echo "上游提交：$COMMIT"
          echo "pinned=$PINNED" >> "$GITHUB_OUTPUT"
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          echo "repo=$REPO" >> "$GITHUB_OUTPUT"
          echo "commit=$COMMIT" >> "$GITHUB_OUTPUT"
          if [ "patches/$PINNED" = "$NEW" ] || [ "$PINNED" = "$NEW" ]; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: 下新补丁并试打
        if: steps.up.outputs.changed == 'true'
        id: try
        run: |
          set -euo pipefail
          BASE_REPO=$(jq -r '.base.repository' upstream.json)
          BASE_TAG=$(jq -r '.base.tag' upstream.json)
          BASE_SHA=$(jq -r '.base.tarball_sha256 // ""' upstream.json)
          REPO="${{ steps.up.outputs.repo }}"
          COMMIT="${{ steps.up.outputs.commit }}"
          PATH_IN_REPO="${{ steps.up.outputs.new }}"
          case "$PATH_IN_REPO" in patches/*) URL_PATH="$PATH_IN_REPO" ;; *) URL_PATH="patches/$PATH_IN_REPO" ;; esac

          curl -fL --retry 3 -o upstream.tar.gz "https://codeload.github.com/$BASE_REPO/tar.gz/refs/tags/$BASE_TAG"
          if [ -n "$BASE_SHA" ]; then echo "$BASE_SHA  upstream.tar.gz" | sha256sum -c -; fi
          mkdir -p src
          tar xzf upstream.tar.gz -C src --strip-components=1

          curl -fL --retry 3 -o pudding.patch "https://raw.githubusercontent.com/$REPO/$COMMIT/$URL_PATH"
          PSHA=$(sha256sum pudding.patch | cut -d' ' -f1)
          echo "patch_sha=$PSHA" >> "$GITHUB_OUTPUT"
          echo "patch_path=$URL_PATH" >> "$GITHUB_OUTPUT"

          cd src
          FAILED=0
          for P in ../pudding.patch ../patches/skyward-nuwa-extra.patch; do
            echo "== 试打 $(basename "$P")"
            if ! patch -p1 --batch --dry-run --no-backup-if-mismatch < "$P" > /tmp/dry.log 2>&1; then
              echo "!! 与 $(basename "$P") 冲突："
              grep -E 'FAILED|Hunk|patching file' /tmp/dry.log | head -60 || true
              FAILED=1
              continue
            fi
            patch -p1 --batch --no-backup-if-mismatch < "$P" > /dev/null
          done
          echo "failed=$FAILED" >> "$GITHUB_OUTPUT"

      - name: 过得去就更新 pin 并出包
        if: steps.up.outputs.changed == 'true' && steps.try.outputs.failed == '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          COMMIT="${{ steps.up.outputs.commit }}"
          PATH_IN_REPO="${{ steps.try.outputs.patch_path }}"
          PSHA="${{ steps.try.outputs.patch_sha }}"
          jq --arg c "$COMMIT" --arg p "$PATH_IN_REPO" --arg s "$PSHA" \
            '.patches.commit = $c | .patches.path = $p | .patches.sha256 = $s' upstream.json > upstream.json.new
          mv upstream.json.new upstream.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add upstream.json
          git commit -m "sync: 上游补丁 ${{ steps.up.outputs.pinned }} → $PATH_IN_REPO（补丁链原样打得进去）[skip ci]"
          git push
          # GITHUB_TOKEN 推的提交不会触发别的 workflow，所以显式叫一次构建
          gh workflow run build.yml --ref main
          echo "已更新 pin 并触发构建"

      - name: 有冲突就开 issue 等人合
        if: steps.up.outputs.changed == 'true' && steps.try.outputs.failed != '0'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          NEW="${{ steps.up.outputs.new }}"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY=$(printf '%s\n' \
            "上游出了 \`$NEW\`，本仓库的补丁链（该补丁 + \`patches/skyward-nuwa-extra.patch\`）打不进去。" \
            "" \
            "处理办法：" \
            "" \
            "1. 取上游源码与该补丁，按 \`README.md\` 的「从源码重建」一步步试" \
            "2. 合完把结果重出一份 \`patches/skyward-nuwa-extra.patch\`" \
            "3. 改 \`upstream.json\` 的 \`patches.commit\` / \`patches.path\` / \`patches.sha256\`" \
            "4. 推 main，构建流程自己出包" \
            "" \
            "构建日志：$RUN_URL" \
            "" \
            "本地也能先试一遍：\`scripts/sync-upstream.sh $NEW\`")
          gh issue create --title "上游 $NEW 与本仓库的补丁冲突，需要手工合" --body "$BODY" || echo "issue 已存在，跳过"
          echo "::error::上游 $NEW 与补丁冲突，见 issue"
          exit 1
